name: news-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-news_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_platform_dev}
      POSTGRES_DB: ${POSTGRES_DB:-news_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_platform}:${POSTGRES_PASSWORD:-news_platform_dev}@postgres:5432/${POSTGRES_DB:-news_platform}
      REDIS_URL: redis://redis:6379/0
      INGESTION_CLOCK_SKEW_SECONDS: ${INGESTION_CLOCK_SKEW_SECONDS:-300}
      INGESTION_RATE_LIMIT: ${INGESTION_RATE_LIMIT:-300}
      INGESTION_RATE_LIMIT_WINDOW_SECONDS: ${INGESTION_RATE_LIMIT_WINDOW_SECONDS:-60}
      PYTHONPATH: /app/src
    command: ["sh", "-c", "alembic upgrade head && uvicorn news_platform.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-news_platform}:${POSTGRES_PASSWORD:-news_platform_dev}@postgres:5432/${POSTGRES_DB:-news_platform}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    command: ["python", "-m", "news_platform.worker"]
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: development
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_next:
